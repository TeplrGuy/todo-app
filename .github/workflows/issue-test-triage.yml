name: Test Request Triage

on:
  issues:
    types: [opened, labeled]

jobs:
  triage:
    name: Triage Test Request
    if: |
      contains(github.event.issue.labels.*.name, 'test-request') ||
      contains(github.event.issue.title, '[TEST]') ||
      contains(github.event.issue.title, '[LOAD TEST]') ||
      contains(github.event.issue.title, '[FUNCTIONAL TEST]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Analyze issue and propose tests
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            const title = process.env.ISSUE_TITLE || '';
            const body = process.env.ISSUE_BODY || '';
            const isLoadTest = title.includes('[LOAD TEST]') || body.toLowerCase().includes('load test');
            const isFunctionalTest = title.includes('[FUNCTIONAL TEST]') || body.toLowerCase().includes('functional test');

            let comment = `## 🤖 Automated Test Triage\n\n`;
            comment += `**Issue:** ${title}\n\n`;
            comment += `**Detected test type(s):**\n`;
            if (isLoadTest) comment += `- 🏋️ Load Test (NeoLoad)\n`;
            if (isFunctionalTest) comment += `- ✅ Functional Test\n`;
            if (!isLoadTest && !isFunctionalTest) comment += `- 🔍 General Test Request\n`;

            comment += `\n### Proposed Test Cases\n\n`;

            if (isFunctionalTest || (!isLoadTest && !isFunctionalTest)) {
              comment += `#### Functional Tests\n`;
              comment += `Based on the issue description, here are proposed functional test cases:\n\n`;
              comment += `\`\`\`typescript\n`;
              comment += `// e2e/auto-generated.spec.ts\n`;
              comment += `import { test, expect } from '@playwright/test';\n\n`;
              comment += `test.describe('${title}', () => {\n`;
              comment += `  test('should perform the described action', async ({ page }) => {\n`;
              comment += `    await page.goto('http://localhost:1420');\n`;
              comment += `    // TODO: Implement test based on: ${title}\n`;
              comment += `    // Issue details: ${body.substring(0, 200)}\n`;
              comment += `    expect(true).toBe(true); // Replace with actual assertion\n`;
              comment += `  });\n`;
              comment += `});\n`;
              comment += `\`\`\`\n\n`;
            }

            if (isLoadTest) {
              comment += `#### NeoLoad Load Test Configuration\n`;
              comment += `Proposed NeoLoad test scenario for this issue:\n\n`;
              comment += `\`\`\`yaml\n`;
              comment += `# neoload/scenarios/${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.yml\n`;
              comment += `scenarios:\n`;
              comment += `  - name: "${title}"\n`;
              comment += `    description: "Auto-generated from GitHub issue #${{ github.event.issue.number }}"\n`;
              comment += `    populations:\n`;
              comment += `      - name: "Users"\n`;
              comment += `        rampup:\n`;
              comment += `          duration: 60s\n`;
              comment += `          start_users: 1\n`;
              comment += `          end_users: 50\n`;
              comment += `        constant:\n`;
              comment += `          users: 50\n`;
              comment += `          duration: 300s\n`;
              comment += `    assertions:\n`;
              comment += `      - avg_response_time: "< 2s"\n`;
              comment += `      - error_rate: "< 1%"\n`;
              comment += `\`\`\`\n\n`;
              comment += `**NeoLoad Resources:**\n`;
              comment += `- [NeoLoad Performance Testing](https://www.tricentis.com/lp/neoload-performance-load-testing-ppc)\n`;
              comment += `- See \`neoload/\` directory for test configurations\n\n`;
            }

            comment += `### Next Steps\n`;
            comment += `1. Review the proposed test cases above\n`;
            comment += `2. Create a PR with the implemented tests in \`e2e/\` (functional) or \`neoload/\` (load tests)\n`;
            comment += `3. The CI pipeline will automatically discover and run tests in \`e2e/\`\n`;
            comment += `4. Label this issue with \`tests-proposed\` when done reviewing\n\n`;
            comment += `---\n`;
            comment += `*Auto-triaged by GitHub Actions · [View workflow](../actions/workflows/issue-test-triage.yml)*\n`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['tests-proposed']
            });
