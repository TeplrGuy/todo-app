name: Test Request Triage

on:
  issues:
    types: [opened, labeled]

jobs:
  triage:
    name: Triage Test Request
    if: |
      contains(github.event.issue.labels.*.name, 'test-request') ||
      contains(github.event.issue.title, '[TEST]') ||
      contains(github.event.issue.title, '[LOAD TEST]') ||
      contains(github.event.issue.title, '[FUNCTIONAL TEST]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Analyze issue and propose tests
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            const title = process.env.ISSUE_TITLE || '';
            const body = process.env.ISSUE_BODY || '';
            const bodyLc = body.toLowerCase();
            const labels = context.payload.issue.labels?.map((l) => (l.name || '').toLowerCase()) || [];
            const hasLoadSignal =
              title.includes('[LOAD TEST]') ||
              bodyLc.includes('load test') ||
              labels.includes('load-test');
            const hasFunctionalSignal =
              title.includes('[FUNCTIONAL TEST]') ||
              bodyLc.includes('functional test') ||
              labels.includes('functional-test');

            const isLoadTest = hasLoadSignal;
            const isFunctionalTest = hasFunctionalSignal || !hasLoadSignal;

            const escapeYaml = (v) => (v || '').replace(/"/g, '\\"').replace(/\r?\n/g, ' ').trim();
            const issueTitle = escapeYaml(title) || `Issue ${context.issue.number}`;
            const issueSnippet = escapeYaml(body).slice(0, 180);

            const slug = title
              .toLowerCase()
              .replace(/\[[^\]]*\]/g, ' ')
              .replace(/[^a-z0-9]+/g, '_')
              .replace(/^_+|_+$/g, '')
              .slice(0, 70) || `issue_${context.issue.number}`;

            const tokens = slug.split('_').filter((t) => t.length >= 4);
            const defaultBranch = context.payload.repository.default_branch;
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: defaultBranch
            });
            const defaultBranchSha = branch.data.commit.sha;

            const tree = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: branch.data.commit.commit.tree.sha,
              recursive: 'true'
            });

            const allPaths = (tree.data.tree || [])
              .filter((n) => n.type === 'blob')
              .map((n) => n.path);

            const functionalFiles = allPaths.filter((p) => /^neoload\/functional\/.*\.ya?ml$/i.test(p));
            const loadFiles = allPaths.filter((p) => /^neoload\/scenarios\/.*\.ya?ml$/i.test(p));

            const hasTokenOverlap = (basename) => {
              if (!tokens.length) return false;
              const parts = basename.toLowerCase().replace(/\.ya?ml$/i, '').split(/[^a-z0-9]+/).filter(Boolean);
              const overlap = tokens.filter((t) => parts.includes(t));
              return overlap.length >= Math.min(2, tokens.length);
            };

            const functionalPath = `neoload/functional/${slug}.yml`;
            const loadPath = `neoload/scenarios/${slug}.yml`;

            const functionalExists = functionalFiles.includes(functionalPath);
            const loadExists = loadFiles.includes(loadPath);

            const similarFunctional = functionalFiles.filter((p) => hasTokenOverlap(p.split('/').pop() || ''));
            const similarLoad = loadFiles.filter((p) => hasTokenOverlap(p.split('/').pop() || ''));
            const hasFunctionalCoverageSignal = functionalExists || similarFunctional.length > 0;
            const hasLoadCoverageSignal = loadExists || similarLoad.length > 0;

            const issueBranch = `test-request/issue-${context.issue.number}-${slug}`;
            const implementationFiles = [];
            const proposalFunctionalPath = functionalExists
              ? `neoload/functional/${slug}_issue_${context.issue.number}.yml`
              : functionalPath;
            const proposalLoadPath = loadExists
              ? `neoload/scenarios/${slug}_issue_${context.issue.number}.yml`
              : loadPath;

            if (isFunctionalTest) {
              const functionalYaml = [
                '# Auto-generated by issue-test-triage workflow',
                `# Source issue: #${context.issue.number}`,
                `# Intent: ${issueSnippet || 'Functional coverage request from QA.'}`,
                'name: "' + issueTitle + '"',
                'variables:',
                '  - name: BASE_URL',
                '    value: "http://localhost:1420"',
                'user_paths:',
                '  - name: "Functional Smoke"',
                '    actions:',
                '      steps:',
                '        - think_time: 1s',
                'populations:',
                '  - name: "FunctionalUser"',
                '    user_paths:',
                '      - name: "Functional Smoke"',
                '        distribution: 100%',
                'scenarios:',
                '  - name: "' + issueTitle + '"',
                `    description: "Issue #${context.issue.number} functional implementation suggestion"`,
                '    populations:',
                '      - name: "FunctionalUser"',
                '        duration:',
                '          type: iteration',
                '          count: 1',
                '    assertions:',
                '      - error_rate: "< 1%"',
                '      - avg_response_time: "< 3s"'
              ].join('\n') + '\n';
              implementationFiles.push({ path: proposalFunctionalPath, content: functionalYaml });
            }

            if (isLoadTest) {
              const loadYaml = [
                '# Auto-generated by issue-test-triage workflow',
                `# Source issue: #${context.issue.number}`,
                `# Intent: ${issueSnippet || 'Load/performance request from QA.'}`,
                'name: "' + issueTitle + '"',
                'variables:',
                '  - name: BASE_URL',
                '    value: "http://localhost:1420"',
                'user_paths:',
                '  - name: "Load Path"',
                '    actions:',
                '      steps:',
                '        - think_time: 1s',
                'populations:',
                '  - name: "Users"',
                '    user_paths:',
                '      - name: "Load Path"',
                '        distribution: 100%',
                'scenarios:',
                '  - name: "' + issueTitle + '"',
                `    description: "Issue #${context.issue.number} load implementation suggestion"`,
                '    populations:',
                '      - name: "Users"',
                '        rampup:',
                '          duration: 60s',
                '          start_users: 1',
                '          end_users: 50',
                '        constant:',
                '          users: 50',
                '          duration: 300s',
                '    assertions:',
                '      - avg_response_time: "< 2s"',
                '      - error_rate: "< 1%"'
              ].join('\n') + '\n';
              implementationFiles.push({ path: proposalLoadPath, content: loadYaml });
            }

            const getBranchRef = async () => {
              try {
                return await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${issueBranch}`
                });
              } catch (error) {
                if (error.status === 404) {
                  return github.rest.git.createRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `refs/heads/${issueBranch}`,
                    sha: defaultBranchSha
                  });
                }
                throw error;
              }
            };

            await getBranchRef();

            for (const file of implementationFiles) {
              let existingFileSha;
              let existingFileContent;
              try {
                const existing = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: file.path,
                  ref: issueBranch
                });
                existingFileSha = existing.data.sha;
                existingFileContent = Buffer.from(existing.data.content || '', 'base64').toString('utf8');
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              if (existingFileContent === file.content) {
                continue;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: file.path,
                message: `test(triage): propose NeoLoad implementation for issue #${context.issue.number}`,
                content: Buffer.from(file.content, 'utf8').toString('base64'),
                branch: issueBranch,
                sha: existingFileSha
              });
            }

            const prTitle = `test(triage): implementation suggestion for issue #${context.issue.number}`;
            const prBody = [
              `Auto-generated implementation suggestion for #${context.issue.number}.`,
              '',
              '## Generated Files',
              ...implementationFiles.map((f) => `- ${f.path}`),
              '',
              '## Validation Intent',
              '- Trigger CI for YAML validation and workflow checks',
              '- Provide QA a concrete PR artifact without direct code access',
              '',
              '## Notes',
              '- Review and refine scenario steps based on acceptance criteria',
              '- Keep this PR linked to the source issue for traceability'
            ].join('\n');

            const existingPrs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${issueBranch}`,
              base: defaultBranch
            });

            let prUrl;
            if (existingPrs.data.length > 0) {
              const pr = existingPrs.data[0];
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title: prTitle,
                body: prBody
              });
              prUrl = pr.html_url;
            } else {
              const createdPr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                body: prBody,
                head: issueBranch,
                base: defaultBranch,
                draft: true
              });
              prUrl = createdPr.data.html_url;
            }

            const nl = '\n';
            let comment = '<!-- neoload-triage:v2 -->' + nl + nl;
            comment += '## Automated NeoLoad Test Triage' + nl + nl;
            comment += `Issue: ${title}` + nl + nl;
            comment += `Implementation PR: ${prUrl}` + nl + nl;
            comment += 'Detected test type(s):' + nl;
            if (isFunctionalTest) comment += '- Functional test request' + nl;
            if (isLoadTest) comment += '- Load test request' + nl;
            if (!isFunctionalTest && !isLoadTest) comment += '- General test request (treated as functional by default)' + nl;

            comment += nl + '### Existing Coverage Check' + nl + nl;
            if (isFunctionalTest) {
              comment += functionalExists
                ? `- Functional file already exists: ${functionalPath}` + nl
                : `- No exact functional file found for slug: ${functionalPath}` + nl;
              if (similarFunctional.length) {
                comment += '- Similar functional files:' + nl;
                for (const p of similarFunctional.slice(0, 5)) comment += `  - ${p}` + nl;
              }
            }
            if (isLoadTest) {
              comment += loadExists
                ? `- Load file already exists: ${loadPath}` + nl
                : `- No exact load file found for slug: ${loadPath}` + nl;
              if (similarLoad.length) {
                comment += '- Similar load files:' + nl;
                for (const p of similarLoad.slice(0, 5)) comment += `  - ${p}` + nl;
              }
            }

            if (isFunctionalTest && !functionalExists) {
              comment += nl + '### Functional Baseline (NeoLoad as-code compatible)' + nl + nl;
              comment += '```yaml' + nl;
              comment += `# ${proposalFunctionalPath}` + nl;
              comment += `name: "${title.replace(/"/g, '\\"')}"` + nl;
              comment += 'variables:' + nl;
              comment += '  - name: BASE_URL' + nl;
              comment += '    value: "http://localhost:1420"' + nl;
              comment += 'user_paths:' + nl;
              comment += '  - name: "Functional Smoke"' + nl;
              comment += '    actions:' + nl;
              comment += '      steps:' + nl;
              comment += '        - think_time: 1s' + nl;
              comment += 'populations:' + nl;
              comment += '  - name: "FunctionalUser"' + nl;
              comment += '    user_paths:' + nl;
              comment += '      - name: "Functional Smoke"' + nl;
              comment += '        distribution: 100%' + nl;
              comment += 'scenarios:' + nl;
              comment += `  - name: "${title.replace(/"/g, '\\"')}"` + nl;
              comment += `    description: "Auto-generated from issue #${context.issue.number}"` + nl;
              comment += '    populations:' + nl;
              comment += '      - name: "FunctionalUser"' + nl;
              comment += '        duration:' + nl;
              comment += '          type: iteration' + nl;
              comment += '          count: 1' + nl;
              comment += '    assertions:' + nl;
              comment += '      - error_rate: "< 1%"' + nl;
              comment += '      - avg_response_time: "< 3s"' + nl;
              comment += '```' + nl;
            }

            if (isLoadTest && !loadExists) {
              comment += nl + '### Load Baseline (NeoLoad as-code compatible)' + nl + nl;
              comment += '```yaml' + nl;
              comment += `# ${proposalLoadPath}` + nl;
              comment += `name: "${title.replace(/"/g, '\\"')}"` + nl;
              comment += 'variables:' + nl;
              comment += '  - name: BASE_URL' + nl;
              comment += '    value: "http://localhost:1420"' + nl;
              comment += 'user_paths:' + nl;
              comment += '  - name: "Load Path"' + nl;
              comment += '    actions:' + nl;
              comment += '      steps:' + nl;
              comment += '        - think_time: 1s' + nl;
              comment += 'populations:' + nl;
              comment += '  - name: "Users"' + nl;
              comment += '    user_paths:' + nl;
              comment += '      - name: "Load Path"' + nl;
              comment += '        distribution: 100%' + nl;
              comment += 'scenarios:' + nl;
              comment += `  - name: "${title.replace(/"/g, '\\"')}"` + nl;
              comment += `    description: "Auto-generated from issue #${context.issue.number}"` + nl;
              comment += '    populations:' + nl;
              comment += '      - name: "Users"' + nl;
              comment += '        rampup:' + nl;
              comment += '          duration: 60s' + nl;
              comment += '          start_users: 1' + nl;
              comment += '          end_users: 50' + nl;
              comment += '        constant:' + nl;
              comment += '          users: 50' + nl;
              comment += '          duration: 300s' + nl;
              comment += '    assertions:' + nl;
              comment += '      - avg_response_time: "< 2s"' + nl;
              comment += '      - error_rate: "< 1%"' + nl;
              comment += '```' + nl;
            }

            comment += nl + '### Next Steps' + nl + nl;
            if ((isFunctionalTest && hasFunctionalCoverageSignal) || (isLoadTest && hasLoadCoverageSignal)) {
              comment += '1. Reuse the existing NeoLoad file(s) above where possible.' + nl;
              comment += '2. Review the generated implementation PR and adjust scenario scope if needed.' + nl;
            } else {
              comment += '1. Review the generated implementation PR with QA and engineering.' + nl;
              comment += '2. Expand user path steps based on acceptance criteria and current app architecture.' + nl;
              comment += '3. Merge PR after CI validation and reviewer approval.' + nl;
            }
            comment += '4. Functional CI auto-discovers neoload/functional/*.yml.' + nl + nl;
            comment += 'Auto-triaged by GitHub Actions.' + nl;

            const existingComments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const marker = '<!-- neoload-triage:v2 -->';
            const existingBotComment = existingComments.data.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker)
            );

            if (existingBotComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingBotComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
              }
            };

            const labelsToAdd = ['tests-proposed', 'tests-pr-open'];
            if ((isFunctionalTest && hasFunctionalCoverageSignal) || (isLoadTest && hasLoadCoverageSignal)) {
              labelsToAdd.push('tests-existing');
            }

            await ensureLabel('tests-proposed', '1D76DB', 'Automated triage produced NeoLoad test proposal');
            await ensureLabel('tests-pr-open', '0E8A16', 'Automated triage opened a PR with implementation suggestion');
            if (labelsToAdd.includes('tests-existing')) {
              await ensureLabel('tests-existing', 'FBCA04', 'Likely existing NeoLoad coverage detected');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labelsToAdd
            });
