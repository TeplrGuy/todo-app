name: "Todo App Functional Smoke"

servers:
  - name: todo_app
    host: green-wave-0693f8c0f.7.azurestaticapps.net
    scheme: https

user_paths:
  - name: "Functional Smoke"
    actions:
      steps:
        - request:
            url: /
            server: todo_app
        - delay: 1s

populations:
  - name: "FunctionalUser"
    user_paths:
      - name: "Functional Smoke"

scenarios:
  - name: "Functional Smoke Suite"
    populations:
      - name: "FunctionalUser"
        rampup_load:
          min_users: 1
          max_users: 1
          increment_users: 1
          increment_every: 1s
          duration: 30s
