# NeoLoad Functional Smoke Baseline for Todo App
# Validated against NeoLoad as-code schema (neoload validate passes).
# Requires servers block + at least one request step for NeoLoad SaaS upload.

name: "Todo App Functional Smoke"

servers:
  - name: todo_app
    host: localhost
    port: 1420
    scheme: http

variables:
  - name: BASE_URL
    value: "http://localhost:1420"

user_paths:
  - name: "Functional Smoke"
    actions:
      steps:
        - request:
            url: /
        - think_time: 1s

populations:
  - name: "FunctionalUser"
    user_paths:
      - name: "Functional Smoke"
        distribution: 100%

scenarios:
  - name: "Functional Smoke Suite"
    description: "Baseline smoke scenario generated for CI-safe NeoLoad validation and execution."
    populations:
      - name: "FunctionalUser"
        duration:
          type: iteration
          count: 1
    assertions:
      - error_rate: "< 1%"
      - avg_response_time: "< 3s"
