# NeoLoad Functional Smoke Baseline for Todo App
# This baseline is NeoLoad as-code compatible and passes `neoload validate`.
# Expand actions.steps with additional valid NeoLoad DSL operations as needed.

name: "Todo App Functional Smoke"

variables:
  - name: BASE_URL
    value: "http://localhost:1420"

user_paths:
  - name: "Functional Smoke"
    actions:
      steps:
        - think_time: 1s

populations:
  - name: "FunctionalUser"
    user_paths:
      - name: "Functional Smoke"
        distribution: 100%

scenarios:
  - name: "Functional Smoke Suite"
    description: "Baseline smoke scenario generated for CI-safe NeoLoad validation and execution."
    populations:
      - name: "FunctionalUser"
        duration:
          type: iteration
          count: 1
    assertions:
      - error_rate: "< 1%"
      - avg_response_time: "< 3s"
