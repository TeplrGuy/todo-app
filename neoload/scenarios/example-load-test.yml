# NeoLoad Load Test Baseline for Todo App
# This baseline is NeoLoad as-code compatible and can be extended with
# additional valid NeoLoad DSL operations in actions.steps.

name: "Todo App Load Test"

servers:
  - name: todo_app
    host: localhost
    port: 1420
    scheme: http

variables:
  - name: BASE_URL
    value: "http://localhost:1420"

user_paths:
  - name: "Load Path"
    actions:
      steps:
        - request:
            url: /
        - think_time: 1s

populations:
  - name: "Users"
    user_paths:
      - name: "Load Path"
        distribution: 100%

scenarios:
  - name: "Standard Load Test"
    description: "Ramp to 50 users and hold for 5 minutes."
    populations:
      - name: "Users"
        rampup:
          duration: 60s
          start_users: 1
          end_users: 50
        constant:
          users: 50
          duration: 300s
    assertions:
      - avg_response_time: "< 2s"
      - error_rate: "< 1%"

  - name: "Stress Test"
    description: "Ramp to 200 users and hold for 3 minutes."
    populations:
      - name: "Users"
        rampup:
          duration: 120s
          start_users: 1
          end_users: 200
        constant:
          users: 200
          duration: 180s
    assertions:
      - error_rate: "< 5%"
      - percentile_95_response_time: "< 10s"

  - name: "Soak Test"
    description: "Hold 30 users for 30 minutes."
    populations:
      - name: "Users"
        constant:
          users: 30
          duration: 1800s
    assertions:
      - avg_response_time: "< 2s"
      - error_rate: "< 1%"
