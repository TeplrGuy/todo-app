# NeoLoad Load Test Baseline for Todo App
# This baseline is NeoLoad as-code compatible and can be extended with
# additional valid NeoLoad DSL operations in actions.steps.

name: "Todo App Load Test"

servers:
  - name: todo_app
    host: green-wave-0693f8c0f.7.azurestaticapps.net
    port: 443
    scheme: https

variables:
  - name: BASE_URL
    value: "https://green-wave-0693f8c0f.7.azurestaticapps.net"

user_paths:
  - name: "Load Path"
    actions:
      steps:
        - request:
            url: /
            server: todo_app
            method: GET
        - think_time: 1s

populations:
  - name: "Users"
    user_paths:
      - name: "Load Path"

scenarios:
  - name: "Standard Load Test"
    description: "Ramp to 50 users and hold for 5 minutes."
    populations:
      - name: "Users"
        rampup_load:
          min_users: 1
          max_users: 50
          increment_users: 5
          increment_every: 10s
          duration: "5m"

  - name: "Stress Test"
    description: "Ramp to 200 users and hold for 3 minutes."
    populations:
      - name: "Users"
        rampup_load:
          min_users: 1
          max_users: 200
          increment_users: 20
          increment_every: 10s
          duration: "3m"

  - name: "Soak Test"
    description: "Hold 30 users for 30 minutes."
    populations:
      - name: "Users"
        constant_load:
          users: 30
          duration: "30m"
    assertions:
      - avg_response_time: "< 2s"
      - error_rate: "< 1%"
