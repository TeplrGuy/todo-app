# NeoLoad Load Test — Todo App
# Ramps to 50 concurrent users and sustains load for 5 minutes.
# Trigger locally : neoload run neoload/scenarios/example-load-test.yml
# Trigger in CI   : proposed by issue-test-triage.yml when [LOAD TEST] issue opened

name: "Todo App Load Test"

variables:
  - name: BASE_URL
    value: "http://localhost:1420"

user_paths:
  - name: "Browse Todos"
    actions:
      init:
        steps:
          - navigate:
              url: "${BASE_URL}"
              sla:
                response_time: "< 3s"
      running:
        steps:
          - think_time: 2s
          - fill:
              selector: "[aria-label='New todo']"
              value: "Load test todo ${NL-CustomActionIndex}"
          - click:
              selector: "button[type='submit']"
              sla:
                response_time: "< 1s"
          - think_time: 1s
          - click:
              selector: "[aria-label*='Toggle']"
              sla:
                response_time: "< 1s"
          - think_time: 1s
          - click:
              selector: "button[aria-label='Completed']"
          - think_time: 1s
          - click:
              selector: "button[aria-label='All']"
      end:
        steps:
          - navigate:
              url: "${BASE_URL}"

  - name: "Read Only User"
    actions:
      running:
        steps:
          - navigate:
              url: "${BASE_URL}"
              sla:
                response_time: "< 2s"
          - think_time: 3s
          - click:
              selector: "button[aria-label='Active']"
          - think_time: 2s
          - click:
              selector: "button[aria-label='Completed']"
          - think_time: 2s
          - click:
              selector: "button[aria-label='All']"

populations:
  - name: "PowerUsers"
    user_paths:
      - name: "Browse Todos"
        distribution: 70%
      - name: "Read Only User"
        distribution: 30%

scenarios:
  - name: "Todo App Load Test"
    description: "Ramp 1 → 50 users, sustain 5 min. Validates app under concurrent load."
    populations:
      - name: "PowerUsers"
        rampup:
          duration: 60s
          start_users: 1
          end_users: 50
        constant:
          users: 50
          duration: 300s
    assertions:
      - avg_response_time: "< 2s"
      - error_rate: "< 1%"
      - percentile_95_response_time: "< 4s"

  - name: "Stress Test"
    description: "Push to 200 users to find breaking point."
    populations:
      - name: "PowerUsers"
        rampup:
          duration: 120s
          start_users: 1
          end_users: 200
        constant:
          users: 200
          duration: 180s
    assertions:
      - error_rate: "< 5%"
      - percentile_95_response_time: "< 10s"

  - name: "Soak Test"
    description: "30 users for 30 minutes — detects memory leaks and degradation over time."
    populations:
      - name: "PowerUsers"
        constant:
          users: 30
          duration: 1800s
    assertions:
      - avg_response_time: "< 2s"
      - error_rate: "< 1%"

